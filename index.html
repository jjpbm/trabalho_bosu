<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trabalho BOSU</title>
  
  <!-- Suporte PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BOSU">

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important; 
    }

    html, body {
      min-height: 100%;
      background-color: #0f172a; 
      color: #f8fafc;
    }

    body { 
      display: flex; 
      flex-direction: column; 
      min-height: 100vh;
    }

    /* Cabeçalho */
    header { 
      background: #1e293b; 
      padding: 12px 16px; 
      border-bottom: 2px solid #334155; 
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    
    header h1 { 
      font-size: 1.5rem; 
      font-weight: 800; 
      color: #38bdf8; 
      letter-spacing: 1px; 
    }
    
    .header-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .phone-info { 
      background: #0f172a; 
      padding: 6px 12px; 
      border-radius: 8px; 
      color: #f1f5f9; 
      font-weight: 600; 
      border: 1px solid #334155; 
      font-size: 0.95rem; 
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .phone-icon {
      color: #ef4444;
      font-size: 1.1rem;
    }

    #clockDisplay { 
      color: #38bdf8; 
      font-weight: 800; 
      font-size: 1.2rem; 
      letter-spacing: 1px;
    }

    .btn-fs { 
      background: #0284c7; 
      color: white; 
      border: none; 
      padding: 6px 12px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 0.85rem; 
      display: flex; 
      align-items: center; 
      gap: 6px; 
    }
    .btn-fs:hover { background: #0369a1; }

    /* Controlos */
    .controls { 
      background: #1e293b; 
      padding: 12px 16px; 
      border-bottom: 1px solid #334155; 
      display: flex; 
      gap: 10px; 
      flex-wrap: wrap; 
      align-items: center;
    }
    .controls input[type="text"] { 
      flex: 2; 
      min-width: 180px; 
      padding: 10px 14px; 
      border: 1px solid #475569; 
      border-radius: 8px; 
      background: #0f172a; 
      color: white; 
      font-size: 1rem; 
    }
    .controls select { 
      flex: 1;
      min-width: 130px;
      padding: 10px 14px; 
      border: 1px solid #475569; 
      border-radius: 8px; 
      background: #0f172a; 
      color: white; 
      font-size: 1rem; 
    }
    .controls button.add-btn { 
      background: #10b981; 
      color: white; 
      border: none; 
      padding: 10px 20px; 
      border-radius: 8px; 
      font-weight: 700; 
      cursor: pointer; 
      font-size: 1rem; 
    }
    .controls button.batch-clean-btn {
      background: #475569;
      color: #fca5a5;
      border: 1px solid #ef4444;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      margin-left: auto;
    }
    .controls button.batch-clean-btn:hover { background: #7f1d1d; color: white; }

    /* Colunas */
    .board { 
      display: grid; 
      grid-template-columns: 1fr; 
      gap: 16px; 
      padding: 16px; 
      flex: 1; 
    }
    
    .column { 
      background: #1e293b; 
      border-radius: 12px; 
      padding: 16px; 
      border: 1px solid #334155; 
      display: flex; 
      flex-direction: column; 
    }
    .column-header { 
      font-size: 1.3rem; 
      font-weight: 700; 
      margin-bottom: 16px; 
      padding-bottom: 10px; 
      border-bottom: 3px solid; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
    }
    .col-todo .column-header { border-color: #f97316; color: #fb923c; }
    .col-done .column-header { border-color: #10b981; color: #34d399; }
    
    .card-list { display: flex; flex-direction: column; gap: 12px; flex: 1; }
    
    /* Cartões */
    .card { 
      background: #334155; 
      padding: 14px 16px; 
      border-radius: 8px; 
      font-size: 1.2rem; 
      font-weight: 600; 
      display: flex; 
      flex-direction: column; 
      gap: 12px;
      border-left: 6px solid #64748b; 
      transition: all 0.3s ease;
      overflow-wrap: break-word; 
    }
    .col-todo .card { border-left-color: #f97316; }
    .col-done .card { border-left-color: #10b981; }

    .card-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 10px;
      flex-wrap: wrap;
    }
    .card-text-container {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
      flex-wrap: wrap;
    }
    .card-text {
      flex: 1;
      min-width: 140px;
    }

    /* Etiqueta da Sala */
    .room-badge {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
      background: #0f172a;
      border: 1px solid #475569;
      color: #94a3b8;
    }
    .room-badge.sala-1 { border-color: #38bdf8; color: #38bdf8; }
    .room-badge.sala-2 { border-color: #a855f7; color: #c084fc; }
    .room-badge.sala-3 { border-color: #ec4899; color: #f472b6; }
    .room-badge.fora-bloco { border-color: #eab308; color: #facc15; }

    /* Estado: A Decorrer e Cronómetro */
    .card.running {
      border-left-color: #38bdf8 !important;
      background: #1e3a5f !important;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
      border: 1px solid #38bdf8;
    }
    .running-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0284c7;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      animation: pulseGlow 1.8s infinite;
      white-space: nowrap;
      flex-shrink: 0;
    }
    @keyframes pulseGlow {
      0% { opacity: 0.7; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.03); }
      100% { opacity: 0.7; transform: scale(0.98); }
    }
    
    .card-actions { 
      display: flex; 
      gap: 8px; 
      align-items: center; 
      flex-wrap: wrap; 
    }
    .card-actions button { 
      border: none; 
      background: #475569; 
      color: white; 
      padding: 8px 12px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 0.95rem; 
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .card-actions button.btn-play { background: #0284c7; }
    .card-actions button.btn-play.active { background: #eab308; color: #0f172a; }
    .card-actions button.btn-edit { background: #64748b; }
    .card-actions button.btn-reorder { background: #334155; border: 1px solid #475569; }
    .card-actions button.btn-move { background: #10b981; }
    .card-actions button.delete { background: #ef4444; }

    /* MODO BLOCO OPERATÓRIO / TV (> 900px) */
    @media (min-width: 900px) {
      header { padding: 18px 32px; }
      header h1 { font-size: 2.5rem; }
      
      .phone-info { font-size: 1.4rem; padding: 8px 18px; }
      .phone-icon { font-size: 1.5rem; }
      #clockDisplay { font-size: 1.9rem; margin-left: 12px; }
      .btn-fs { font-size: 1.1rem; padding: 10px 18px; margin-left: 12px; }

      .controls { padding: 16px 32px; gap: 14px; }
      .controls input[type="text"], .controls select, .controls button.add-btn { 
        font-size: 1.3rem; 
        padding: 12px 18px; 
      }
      .controls button.batch-clean-btn { font-size: 1.1rem; padding: 12px 18px; }

      .board { grid-template-columns: 1fr 1fr; gap: 28px; padding: 28px; }
      .column { padding: 24px; border-radius: 16px; }
      .column-header { font-size: 2rem; margin-bottom: 20px; }
      
      .card { 
        flex-direction: row; 
        justify-content: space-between;
        align-items: center;
        font-size: 1.9rem; 
        padding: 20px 24px; 
        border-radius: 12px; 
        border-left-width: 10px; 
      }
      .room-badge { font-size: 1.1rem; padding: 5px 12px; }
      .running-tag { font-size: 1rem; padding: 5px 14px; }
      .card-actions button { font-size: 1.1rem; padding: 10px 16px; }
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

    const SENHA_CORRETA = "bosu123"; 

    // CONFIGURAÇÃO FIREBASE (Manter chaves)
    const firebaseConfig = {
       apiKey: "AIzaSyASiNTd_r5CzxxgxQNuBL5UPtVjI5HpDcE",
  authDomain: "trabalho-bosu.firebaseapp.com",
  databaseURL: "https://trabalho-bosu-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "trabalho-bosu",
  storageBucket: "trabalho-bosu.firebasestorage.app",
  messagingSenderId: "798452896445",
  appId: "1:798452896445:web:c1ee684a8ed2e076915dd4",
  measurementId: "G-L82P8EPRKY"
    };
    const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbzL4G7kqJqwhfaaJS1mYM_JN9AguYAG2uYtkCCfIGQy0dWHGbnwylmXoZiGcOeVQLwrsg/exec";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    signInAnonymously(auth).catch(err => console.error(err));

    const tasksRef = ref(db, 'tarefas_bosu');

    let temAcessoEscrita = false;
    const senhaIntroduzida = prompt("Introduza a palavra-passe para gerir a lista:");

    if (senhaIntroduzida === SENHA_CORRETA) {
      temAcessoEscrita = true;
    } else {
      alert("Modo de Apenas Leitura ativado.");
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (!temAcessoEscrita) {
        const controlsDiv = document.querySelector('.controls');
        if (controlsDiv) controlsDiv.style.display = 'none';
      }

      // Relógio
      function updateClock() {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
        const clockElem = document.getElementById('clockDisplay');
        if (clockElem) clockElem.textContent = timeStr;
      }
      setInterval(updateClock, 1000);
      updateClock();

      // Atualizador dinâmico de cronómetros no ecrã
      setInterval(() => {
        document.querySelectorAll('.running-tag').forEach(tag => {
          const start = parseInt(tag.dataset.start);
          if (start) {
            const mins = Math.max(0, Math.floor((Date.now() - start) / 60000));
            tag.innerHTML = `● A decorrer (${mins} min)`;
          }
        });
      }, 10000);

      // Ecrã Inteiro
      const btnFs = document.getElementById('btnFullscreen');
      btnFs.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => console.error(err));
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
        }
      });

      // Formulário Adicionar
      const taskInput = document.getElementById('taskInput');
      const roomSelect = document.getElementById('roomSelect');
      const statusSelect = document.getElementById('statusSelect');
      const addBtn = document.getElementById('addBtn');
      const batchCleanBtn = document.getElementById('batchCleanBtn');
      const todoList = document.getElementById('todoList');
      const doneList = document.getElementById('doneList');
      const todoHeader = document.getElementById('todoHeader');
      const doneHeader = document.getElementById('doneHeader');

      let currentDoneItems = [];

      if (addBtn && temAcessoEscrita) {
        addBtn.addEventListener('click', () => {
          const text = taskInput.value.trim();
          if (!text) return;
          push(tasksRef, { 
            text, 
            room: roomSelect.value,
            status: statusSelect.value, 
            isRunning: false,
            startTime: null,
            order: Date.now(), 
            timestamp: Date.now() 
          });
          taskInput.value = '';
        });
      }

      // Limpeza em Lote de "Feito"
      if (batchCleanBtn && temAcessoEscrita) {
        batchCleanBtn.addEventListener('click', () => {
          if (currentDoneItems.length === 0) {
            alert("Não existem procedimentos concluídos para arquivar.");
            return;
          }

          if (confirm(`Tem a certeza que deseja arquivar todos os ${currentDoneItems.length} procedimentos concluídos e limpar a lista?`)) {
            const batchPayload = currentDoneItems.map(item => {
              const now = new Date();
              const duracao = item.startTime ? Math.max(0, Math.round((now.getTime() - item.startTime) / 60000)) : "";
              const horaInicioStr = item.startTime ? new Date(item.startTime).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' }) : "--:--";

              return {
                texto: item.text,
                local: item.room || "N/A",
                horaInicio: horaInicioStr,
                horaFim: now.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' }),
                duracaoMin: duracao
              };
            });

            if (URL_GOOGLE_SCRIPT && !URL_GOOGLE_SCRIPT.includes("COLE_AQUI")) {
              fetch(URL_GOOGLE_SCRIPT, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(batchPayload)
              }).catch(err => console.error("Erro no envio em lote:", err));
            }

            // Remove todos os feitos do Firebase
            currentDoneItems.forEach(item => {
              remove(ref(db, `tarefas_bosu/${item.id}`));
            });
          }
        });
      }

      // Renderização
      onValue(tasksRef, (snapshot) => {
        todoList.innerHTML = '';
        doneList.innerHTML = '';
        const data = snapshot.val();
        
        let todoItems = [];
        currentDoneItems = [];

        if (data) {
          const items = Object.keys(data).map(key => ({ id: key, ...data[key] }));
          items.sort((a, b) => (a.order || a.timestamp || 0) - (b.order || b.timestamp || 0));

          todoItems = items.filter(item => item.status === 'todo');
          currentDoneItems = items.filter(item => item.status === 'done');

          todoItems.forEach((item, index) => {
            todoList.appendChild(createCardElement(item.id, item, index, todoItems));
          });

          currentDoneItems.forEach((item, index) => {
            doneList.appendChild(createCardElement(item.id, item, index, currentDoneItems));
          });
        }

        todoHeader.textContent = `Por Fazer (${todoItems.length})`;
        doneHeader.textContent = `Feito (${currentDoneItems.length})`;
      });

      function createCardElement(id, item, index, listArray) {
        const div = document.createElement('div');
        div.className = 'card' + (item.isRunning ? ' running' : '');
        
        const headerRow = document.createElement('div');
        headerRow.className = 'card-header-row';

        const textContainer = document.createElement('div');
        textContainer.className = 'card-text-container';

        // Etiqueta do Local (apenas é criada se tiver uma sala definida)
        if (item.room && item.room.trim() !== "") {
          const roomBadge = document.createElement('span');
          const roomSlug = item.room.toLowerCase().replace(/\s+/g, '-');
          roomBadge.className = `room-badge ${roomSlug}`;
          roomBadge.textContent = item.room;
          textContainer.appendChild(roomBadge);
        }

        const textSpan = document.createElement('span');
        textSpan.className = 'card-text';
        textSpan.textContent = item.text;
        textContainer.appendChild(textSpan);

        headerRow.appendChild(textContainer);

        // Cronómetro / Em curso
        if (item.isRunning) {
          const tag = document.createElement('span');
          tag.className = 'running-tag';
          tag.dataset.start = item.startTime || Date.now();
          const mins = item.startTime ? Math.max(0, Math.floor((Date.now() - item.startTime) / 60000)) : 0;
          tag.innerHTML = `● A decorrer (${mins} min)`;
          headerRow.appendChild(tag);
        }

        div.appendChild(headerRow);

        if (temAcessoEscrita) {
          const actionsDiv = document.createElement('div');
          actionsDiv.className = 'card-actions';

          if (item.status === 'todo') {
            // 1. Play / Pause
            const playBtn = document.createElement('button');
            playBtn.className = 'btn-play' + (item.isRunning ? ' active' : '');
            playBtn.innerHTML = item.isRunning ? '⏸️' : '▶️';
            playBtn.title = item.isRunning ? 'Pausar' : 'Iniciar procedimento';
            playBtn.onclick = () => {
              const now = Date.now();
              update(ref(db, `tarefas_bosu/${id}`), { 
                isRunning: !item.isRunning,
                startTime: !item.isRunning ? (item.startTime || now) : item.startTime 
              });
            };
            actionsDiv.appendChild(playBtn);

            // 2. Editar (Texto e Sala)
            const editBtn = document.createElement('button');
            editBtn.className = 'btn-edit';
            editBtn.innerHTML = '✏️';
            editBtn.title = 'Editar procedimento ou sala';
            editBtn.onclick = () => {
              const novoTexto = prompt("Modificar o procedimento:", item.text);
              if (novoTexto === null) return;

              const opcoesSala = "Definir local:\n0 - Sem Sala\n1 - Sala 1\n2 - Sala 2\n3 - Sala 3\n4 - Fora do Bloco";
              const escolhaSala = prompt(opcoesSala, item.room ? item.room : "0");

              let novaSala = item.room || "";
              if (escolhaSala === "0" || escolhaSala === "" || escolhaSala === null) novaSala = "";
              else if (escolhaSala === "1" || escolhaSala.toLowerCase() === "sala 1") novaSala = "Sala 1";
              else if (escolhaSala === "2" || escolhaSala.toLowerCase() === "sala 2") novaSala = "Sala 2";
              else if (escolhaSala === "3" || escolhaSala.toLowerCase() === "sala 3") novaSala = "Sala 3";
              else if (escolhaSala === "4" || escolhaSala.toLowerCase() === "fora do bloco") novaSala = "Fora do Bloco";
              else novaSala = escolhaSala;

              update(ref(db, `tarefas_bosu/${id}`), { 
                text: novoTexto.trim() !== "" ? novoTexto.trim() : item.text,
                room: novaSala
              });
            };
            actionsDiv.appendChild(editBtn);
            // 3. Ordem
            if (index > 0) {
              const upBtn = document.createElement('button');
              upBtn.className = 'btn-reorder';
              upBtn.innerHTML = '⬆️';
              upBtn.title = 'Subir prioridade';
              upBtn.onclick = () => swapOrder(item, listArray[index - 1]);
              actionsDiv.appendChild(upBtn);
            }

            if (index < listArray.length - 1) {
              const downBtn = document.createElement('button');
              downBtn.className = 'btn-reorder';
              downBtn.innerHTML = '⬇️';
              downBtn.title = 'Descer prioridade';
              downBtn.onclick = () => swapOrder(item, listArray[index + 1]);
              actionsDiv.appendChild(downBtn);
            }

            // 4. Mover p/ Feito
            const moveBtn = document.createElement('button');
            moveBtn.className = 'btn-move';
            moveBtn.textContent = '➔ Feito';
            moveBtn.onclick = () => {
              update(ref(db, `tarefas_bosu/${id}`), { 
                status: 'done', 
                isRunning: false,
                endTime: Date.now()
              });
            };
            actionsDiv.appendChild(moveBtn);
          }

          // Botão Apagar Individual
          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'delete';
          deleteBtn.innerHTML = '🗑️';
          deleteBtn.title = 'Apagar';
          deleteBtn.onclick = () => {
            if (item.status === 'done' && URL_GOOGLE_SCRIPT && !URL_GOOGLE_SCRIPT.includes("COLE_AQUI")) {
              const now = new Date();
              const duracao = item.startTime ? Math.max(0, Math.round((now.getTime() - item.startTime) / 60000)) : "";
              const horaInicioStr = item.startTime ? new Date(item.startTime).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' }) : "--:--";

              fetch(URL_GOOGLE_SCRIPT, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  texto: item.text,
                  local: item.room || "N/A",
                  horaInicio: horaInicioStr,
                  horaFim: now.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' }),
                  duracaoMin: duracao
                })
              }).catch(err => console.error("Erro ao enviar para o Sheets:", err));
            }

            remove(ref(db, `tarefas_bosu/${id}`));
          };
          actionsDiv.appendChild(deleteBtn);
          div.appendChild(actionsDiv);
        }

        return div;
      }

      function swapOrder(itemA, itemB) {
        const orderA = itemA.order || itemA.timestamp || 0;
        const orderB = itemB.order || itemB.timestamp || 0;
        const newOrderA = (orderA === orderB) ? orderB + 1 : orderB;
        const newOrderB = orderA;

        update(ref(db, `tarefas_bosu/${itemA.id}`), { order: newOrderA });
        update(ref(db, `tarefas_bosu/${itemB.id}`), { order: newOrderB });
      }
    });
  </script>
</head>
<body>

  <header>
    <h1>Trabalho BOSU</h1>
    <div class="header-info">
      <span class="phone-info"><span class="phone-icon">&#9742;</span> Anestesia: 31615</span>
      <span id="clockDisplay">--:--</span>
      <button class="btn-fs" id="btnFullscreen">⛶ </button>
    </div>
  </header>

  <div class="controls">
    <input type="text" id="taskInput" placeholder="Escreva o procedimento..." />
   <select id="roomSelect">
      <option value="">Sem Sala / A definir</option>
      <option value="Sala 1">Sala 1</option>
      <option value="Sala 2">Sala 2</option>
      <option value="Sala 3">Sala 3</option>
      <option value="Fora do Bloco">Fora do Bloco</option>
    </select>
    <select id="statusSelect">
      <option value="todo">Por Fazer</option>
      <option value="done">Feito</option>
    </select>
    <button class="add-btn" id="addBtn">Adicionar</button>
